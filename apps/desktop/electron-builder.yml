# electron-builder config, run with apps/desktop as the project directory.
# Consumes the pre-built out/ tree produced by `electron-vite build` +
# copy-renderer.mjs; it never owns the transpile/bundle step (see PRD 8.1 §1).
appId: com.zeo.browser
productName: zeo
directories:
  # Resolved relative to apps/desktop: repo-root release/ and apps/desktop/build/.
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  # Native bindings (better-sqlite3) must load as real files, not from the asar.
  # Preloads (including the adblocker's cosmetic session preload) stay packed:
  # Electron reads preload scripts through its asar-aware loader.
  - "**/*.node"
# electron-builder's default: run @electron/rebuild over native deps at package
# time (pnpm never builds better-sqlite3 on install, see allowBuilds). The
# current better-sqlite3 also ships N-API prebuilds, which load under Electron.
npmRebuild: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Ad-hoc signing only (no Developer ID, no notarization) per PRD 8.1 §2.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
artifactName: ${productName}-${version}-${arch}.${ext}
